# edgeQAM Fishball : modulateur DVB-T dans le FPGA, lu au demarrage par /etc/init.d/S99edgeqam
# Modifiable ici (racine de la carte SD) ou en direct par l'API :
#   http://<carte>:8080/status                     etat (JSON)
#   http://<carte>:8080/set?freq=482000000&att=20&disable=0&save=1
# Chaque multiplex : DVB-T 2K, 64-QAM, 7/8, GI 1/32, 8 MHz = 31,668449 Mbit/s de TS (CBR conseille).

# 1 = modulateur lance au demarrage
ENABLE=1
# nombre de multiplex : 1 (bitstream v1), 2 ou 4 (bitstream fishball_edgeqam)
NMUX=4
# frequence du multiplex 1 (Hz, centre du canal, celle qu'on regle sur un televiseur) ;
# les suivants sont dans les canaux voisins : multiplex k a FREQ + (k-1) x 8 MHz
#   FREQ=474000000 et NMUX=4 -> 474, 482, 490, 498 MHz (canaux UHF 21 a 24)
FREQ=474000000
# attenuation TX (dB) : 0 = puissance max (quelques dBm, non mesuree), 89.75 = coupe
ATT=30
# multiplex desactives : plus aucune porteuse emise sur leur canal de 8 MHz, les autres continuent
# (masque a additionner : 1 = multiplex 1, 2 = multiplex 2, 4 = multiplex 3, 8 = multiplex 4 ;
# 0 = tous emis ; ex. 12 = multiplex 3 et 4 desactives). Un multiplex actif sans flux d entree est
# emis quand meme, rempli de paquets nuls ; un multiplex sans INPUT est desactive d office.
DISABLE=0
# une entree par multiplex (multiplex 1 = port 1001 ... multiplex 4 = port 1004) :
#   udp:PORT | udp:GROUPE_MULTICAST:PORT | file:/chemin.ts
INPUT0=udp:1001
INPUT1=udp:1002
INPUT2=udp:1003
INPUT3=udp:1004
HTTP_PORT=8080
